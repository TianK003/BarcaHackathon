# P31 (docs/proposals.md): p27_final.toml but for this description and the decoder's team_neutral_dead.

description = "P31: p27_final with team evidence level with D (team_neutral_dead)"
seed = 0
scope = "halves"

[[evidence]]
kind = "controlled_touch"
radius = 1.5
max_rel_speed = 6.0
min_frames = 1
confidence = 0.93    # touch_stats.py --grid r013 --profile generic: floor of the pooled agreement
hold = 0.6

[[evidence]]
kind = "dead_ball_model"
weight = 1.0
model = "pipeline/models/dead_ball_hgb.json"

[[evidence]]
kind = "shape_possession"
weight = 0.3
model = "pipeline/models/shape_possession_hgb.json"
scope = "all"
min_prob = 0.02

[decoder]
kind = "hmm"
switch_team = 6
switch_dead = 32
min_possession = 35
min_dead = 25
team_neutral_dead = true

[[refine]]
kind = "shift_edges"
team = 1
into_dead = -2
out_of_dead = 0
