# P34: p30_w030 with the version 2 shape model trained on both truths' labels; nothing else differs.

description = "P34: p30_w030 with the version 2 shape model trained on both truths' labels (raw and coarse, weight 0.5 where they differ)"
seed = 0
scope = "halves"

[[evidence]]
kind = "controlled_touch"
radius = 1.5
max_rel_speed = 6.0
min_frames = 1
confidence = 0.93    # touch_stats.py --grid r013 --profile generic: floor of the pooled agreement
hold = 0.6

[[evidence]]
kind = "dead_ball_model"
weight = 1.0
model = "pipeline/models/dead_ball_hgb.json"

[[evidence]]
kind = "shape_possession"
weight = 0.3
model = "pipeline/models/shape_possession_v2both_hgb.json"
scope = "all"
min_prob = 0.02

[decoder]
kind = "hmm"
switch_team = 6
switch_dead = 32
min_possession = 35
min_dead = 25

[[refine]]
kind = "shift_edges"
team = 1
into_dead = -2
out_of_dead = 0
