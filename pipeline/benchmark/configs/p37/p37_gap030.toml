# P37: p37_split with the gaps source reading the version 4 shape model (each team's time since and until its control
# episodes) at weight 0.30; nothing else differs. The model file is trained by
# pipeline/benchmark/train_shape.py --features 4. An alternative for Tian, never the night's candidate (T38).

description = "P37: p37_split with the gaps source reading the shape model of features version 4 (time since and until control)"
seed = 0
scope = "halves"

[[evidence]]
kind = "controlled_touch"
radius = 1.5
max_rel_speed = 6.0
min_frames = 1
confidence = 0.93    # touch_stats.py --grid r013 --profile generic: floor of the pooled agreement
hold = 0.6

[[evidence]]
kind = "dead_ball_model"
weight = 1.0
model = "pipeline/models/dead_ball_hgb.json"

[[evidence]]
kind = "shape_possession"
weight = 0.3
model = "pipeline/models/shape_possession_v2_hgb.json"
scope = "visible"
min_prob = 0.02

[[evidence]]
kind = "shape_possession"
name = "shape_gaps"
weight = 0.3
model = "pipeline/models/shape_possession_v4_hgb.json"
scope = "gaps"
min_prob = 0.02

[[evidence]]
kind = "team_model"
weight = 0.3
model = "pipeline/models/team_model_hgb.json"

[decoder]
kind = "hmm"
switch_team = 6
switch_dead = 32
min_possession = 35
min_dead = 25

[[refine]]
kind = "shift_edges"
team = 1
into_dead = -2
out_of_dead = 0
