# P37 sanity (not a candidate): p32_w030 with its shape source split in two, version 2 at scope "visible" and version 2
# at scope "gaps" (named shape_gaps), both at weight 0.30. On every frame one of the two speaks, so the decode must
# reproduce p32_w030 to the last digit.

description = "P37 sanity: p32_w030 with the version 2 shape source split into visible and gaps at 0.30 each (equal to p32_w030)"
seed = 0
scope = "halves"

[[evidence]]
kind = "controlled_touch"
radius = 1.5
max_rel_speed = 6.0
min_frames = 1
confidence = 0.93    # touch_stats.py --grid r013 --profile generic: floor of the pooled agreement
hold = 0.6

[[evidence]]
kind = "dead_ball_model"
weight = 1.0
model = "pipeline/models/dead_ball_hgb.json"

[[evidence]]
kind = "shape_possession"
weight = 0.3
model = "pipeline/models/shape_possession_v2_hgb.json"
scope = "visible"
min_prob = 0.02

[[evidence]]
kind = "shape_possession"
name = "shape_gaps"
weight = 0.3
model = "pipeline/models/shape_possession_v2_hgb.json"
scope = "gaps"
min_prob = 0.02

[[evidence]]
kind = "team_model"
weight = 0.3
model = "pipeline/models/team_model_hgb.json"

[decoder]
kind = "hmm"
switch_team = 6
switch_dead = 32
min_possession = 35
min_dead = 25

[[refine]]
kind = "shift_edges"
team = 1
into_dead = -2
out_of_dead = 0
