# P35: p32_w030 with the turnover hazard (A2's model, a direct change of team within 12 frames) read by the
# hmm decoder as a per-frame switch cost at scale 1.0; nothing else differs. The model file is trained by
# pipeline/benchmark/train_turnover.py. Scale 0 is the sanity config: it must equal p32_w030 to the last digit.

description = "P35: p32_w030 with the turnover hazard as a per-frame switch cost, scale 1.0"
seed = 0
scope = "halves"

[[evidence]]
kind = "controlled_touch"
radius = 1.5
max_rel_speed = 6.0
min_frames = 1
confidence = 0.93    # touch_stats.py --grid r013 --profile generic: floor of the pooled agreement
hold = 0.6

[[evidence]]
kind = "dead_ball_model"
weight = 1.0
model = "pipeline/models/dead_ball_hgb.json"

[[evidence]]
kind = "shape_possession"
weight = 0.3
model = "pipeline/models/shape_possession_v2_hgb.json"
scope = "all"
min_prob = 0.02

[[evidence]]
kind = "team_model"
weight = 0.3
model = "pipeline/models/team_model_hgb.json"

[[evidence]]
kind = "turnover_hazard"
name = "hazard"
model = "pipeline/models/turnover_hgb.json"

[decoder]
kind = "hmm"
switch_team = 6
switch_dead = 32
min_possession = 35
min_dead = 25
hazard_source = "hazard"
hazard_scale = 1.0

[[refine]]
kind = "shift_edges"
team = 1
into_dead = -2
out_of_dead = 0
