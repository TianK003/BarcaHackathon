# R010 ablation: Stage C's chosen config with P04 removed, `controlled_touch` replaced by `nearest_player` at
# confidence 0.78 (A01); the P05 source and the decoder are unchanged (hmm 4/32/25/25).

description = "R010 ablation, no P04: nearest_player (confidence 0.78) + dead_ball_model (hgb, pipeline/models/dead_ball_hgb.json) at weight 1.0, hmm 4/32/25/25, decoded per half."
seed = 0
scope = "halves"

[[evidence]]
kind = "nearest_player"
confidence = 0.78    # share of in-play, ball-visible frames on which the nearest player's team is right (A01)

[[evidence]]
kind = "dead_ball_model"
weight = 1.0
model = "pipeline/models/dead_ball_hgb.json"

[decoder]
kind = "hmm"
switch_team = 4      # nats a change of team (H <-> A) costs
switch_dead = 32      # nats a change into or out of D costs
min_possession = 25  # frames: no run of H or A shorter than this (1 is no minimum)
min_dead = 25      # frames: no run of D shorter than this (1 is no minimum)
