# P45 Stage B (R009), P05: dead_ball_model (logistic reference, pipeline/models/dead_ball_logistic.json) at weight 1.0, ball_presence at its defaults, nearest_player at 0.78, hmm 8/32/75/1.
# Chosen on the benchmark by the Stage B protocol, never on the public window (docs/traps.md T01).

description = "P45 Stage B (R009): nearest_player 0.78 + dead_ball_model (logistic reference, pipeline/models/dead_ball_logistic.json) at weight 1.0, ball_presence at its defaults, hmm 8/32/75/1, decoded per half."
seed = 0
scope = "halves"

[[evidence]]
kind = "nearest_player"
confidence = 0.78    # the share of in-play, ball-visible frames on which the nearest player's team is right (A01)

[[evidence]]
kind = "dead_ball_model"
weight = 1.0
model = "pipeline/models/dead_ball_logistic.json"

[[evidence]]
kind = "ball_presence"
margin = 0           # frames: every missing frame speaks
missing = 0.2        # P(alive) where the ball is missing (A01)
seen = 0.585         # P(alive) where the ball is seen (A01)

[decoder]
kind = "hmm"
switch_team = 8      # nats a change of team (H <-> A) costs
switch_dead = 32     # nats a change into or out of D costs
min_possession = 75  # frames: no run of H or A shorter than this (1 is no minimum)
min_dead = 1         # frames: no run of D shorter than this (1 is no minimum)
