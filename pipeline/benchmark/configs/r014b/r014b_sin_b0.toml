# The team's current pipeline -- the config that produces the file we would submit today.
#
#   python pipeline/run.py pipeline/configs/main.toml            # -> evaluation/results/main.csv
#
# To try something, copy this file to pipeline/configs/<your_experiment>.toml (the file name becomes the output's
# name), change it, run it, and log the run in docs/results.md. When an experiment wins on validation, its changes
# come back here.
#
# Today this is P04 + P05 + P07 + P02 together, with the touch rule and the decoder re-chosen by R013:
# controlled_touch for `home` (P04: radius 1.5 m, 6.0 m/s, 1 frame, hold 0.60), the hgb dead_ball_model for `alive`
# (P05), shape_possession for `home` on every graded frame (P07, weight 0.2), the hmm decoder (switch_team 4,
# switch_dead 32, min_possession 35, min_dead 25) and, after the decoder, shift_edges at the pipeline's own lag (P02: a
# change of team 1 frame later, a change into D 2 frames earlier, a change out of D unmoved). Every constant was chosen
# on the P01 benchmark (the seven DFL matches degraded as `tracking` v3, three seeds) by a rule declared before its runs,
# or is a measurement, a fixed rule or the documented kick-offs (the audit in docs/technical_document.md, section 5):
# the dead-ball model in R009 and R010, P07's model in R011, and R013 re-chose the touch rule (Stage A, 192 configs),
# then switch_team, min_possession and P07's weight (Stage C, 144 configs) on this file's own evidence, with none of the
# window-derived sources (nearest_player, ball_presence) in any candidate, and re-derived the shift by R012's rule (it
# came out as R012's: +1, -2, 0). R013's guard against R012's main.toml passed (`tracking` raw +0.0267, p 0.0156, 7 wins
# in 7; `tracking` coarse +0.0001; `context`, a sensitivity check, +0.0327 raw and +0.0097 coarse) and so did its
# label-free checks on BAR-ATH. Its file is r013_retune.toml; R012's main.toml is p02_shift.toml, R011's p07_shape.toml
# and R010's p45_hmm.toml. The benchmark overstates P05 for BAR-ATH by an amount it cannot measure (docs/traps.md T38,
# T39), the shape model was trained on other teams' matches, and the raw and the coarse truth still disagree on how
# finely to cut possessions (T33): read R010 to R013 before trusting the size of any gain.

description = "P04 + P05 + P07 + P02, re-chosen by R013: controlled_touch 1.5 m / 6.0 m/s / 1 frame / hold 0.60 (confidence 0.93) + dead_ball_model (hgb, pipeline/models/dead_ball_hgb.json) at weight 1.0 + shape_possession (hgb, pipeline/models/shape_possession_hgb.json) at weight 0.2, scope all, min_prob 0.02, hmm 4/32/35/25, decoded per half, then shift_edges team +1 / into_dead -2 / out_of_dead 0 frames. + restart_team (span stoppage_end, use_ball false, switch_restart inf, measured confidences)"
seed = 0
scope = "halves"

# Each [[evidence]] entry is one source: kind is its key in pipeline/evidence/__init__.py REGISTRY. Optional:
# name = "..." (default: kind; must be unique) and weight = 1.0 (how much the decoder trusts it). Every other key is
# passed to the source as a keyword argument.
[[evidence]]
kind = "controlled_touch"
radius = 1.5                                  # metres: the nearest player must be this close
max_rel_speed = 6.0                           # m/s: and move with the ball
min_frames = 1                                # an episode shorter than this is dropped
confidence = 0.93                             # touch_stats.py --grid r013: floor of the pooled agreement (93.1%)
hold = 0.6                                    # the weak vote of the last team between episodes; 0.5 = off

[[evidence]]
kind = "dead_ball_model"
weight = 1.0
model = "pipeline/models/dead_ball_hgb.json"  # relative to the repo root

[[evidence]]
kind = "shape_possession"
weight = 0.2                                          # an exponent on the source's likelihood (R011, kept by R013)
model = "pipeline/models/shape_possession_hgb.json"   # relative to the repo root; BAR-ATH has no fold, so `full`
scope = "all"                                         # "gaps": ball missing only; "all": every graded frame
min_prob = 0.02                                       # home is clipped to [0.02, 0.98]

# R014b (P17): who restarts, one observation spread over the stoppage that ends at the restart (span stoppage_end), use_ball false,
# the confidences measured at tail 25 (restarts.py stats)
[[evidence]]
kind = "restart_team"
model = "pipeline/models/dead_ball_hgb.json"
span = "stoppage_end"
use_ball = false
corner = 0.93
goal_kick = 0.72
throw_in = 0.92

# Exactly one decoder (pipeline/decode/). Every key but kind is a keyword argument.
[decoder]
kind = "hmm"
switch_team = 4                               # nats a change of team (H <-> A) costs
switch_dead = 32                              # nats a change into or out of D costs
min_possession = 35                           # frames: no run of H or A shorter than this (1 is no minimum)
min_dead = 25                                 # frames: no run of D shorter than this (1 is no minimum)
restart_source = "restart_team"
switch_restart = inf

# Zero or more refiners (pipeline/refine/), applied in order after the decoder. R012's shift: a positive value moves the
# new label later, in frames; a change of label next to an X or at a kick-off never moves.
[[refine]]
kind = "shift_edges"
team = 1                                      # frames: s_b, the pipeline's own lag on DFL (g = 0)
into_dead = -2
out_of_dead = 0
