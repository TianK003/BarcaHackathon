* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
}
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
code, pre, kbd {
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 0.86em;
}
code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0; }
h2 { font-size: 20px; font-weight: 650; }
h3 { font-size: 16px; font-weight: 650; }
h4 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
p { margin: 0 0 10px; }
ul, ol { margin: 0; padding-left: 20px; }
li { margin: 4px 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 720px) { .wrap { padding: 0 24px; } }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }


/* Header: the same look as index.html and rules.html */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; }
.brand h1 { font-size: 17px; font-weight: 700; }
.brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.theme-btn {
  flex: none; border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.theme-btn:hover { background: var(--hover); }
.jump { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.jump::-webkit-scrollbar { display: none; }
.jump a {
  flex: none; padding: 9px 10px 10px; font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.jump a:hover { color: var(--ink); border-bottom-color: var(--accent); }
.jump a.home { color: var(--accent); }
.jump a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main { padding: 20px 0 8px; }
footer { border-top: 1px solid var(--line); margin-top: 24px; padding: 16px 0 28px; font-size: 13px; color: var(--muted); }

.block { margin: 0 0 30px; scroll-margin-top: 110px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 14px; flex-wrap: wrap; margin-bottom: 12px; }
.block-head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 72ch; }

/* Cards, badges */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.kpi-label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
.kpi-value { font-size: 34px; font-weight: 650; line-height: 1.1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.kpi-second { font-size: 15px; font-weight: 600; color: var(--ink-2); margin: 4px 0 0; font-variant-numeric: tabular-nums; }
.kpi-text { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; line-height: 1.5;
  padding: 0 8px; border-radius: 999px; background: var(--b-bg); color: var(--b-fg); vertical-align: middle;
}
td .badge { white-space: normal; }
.ok { --b-bg: var(--ok-bg); --b-fg: var(--ok-fg); }
.off { --b-bg: var(--off-bg); --b-fg: var(--off-fg); }
.ref { --b-bg: var(--ref-bg); --b-fg: var(--ref-fg); }
.bad { --b-bg: var(--bad-bg); --b-fg: var(--bad-fg); }
.info { --b-bg: var(--info-bg); --b-fg: var(--info-fg); }

/* The chart */
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 8px; }
.controls .lbl { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 2px 12px; font-size: 13px; cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--info-bg); color: var(--info-fg); border-color: transparent; font-weight: 650; }
.fchip[aria-pressed="false"] { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin: 4px 0 8px; }
.legend .k { display: inline-flex; align-items: center; gap: 6px; }
.k-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 2px solid var(--ink-2); box-sizing: border-box; }
.k-dot.filled { background: var(--ink-2); }
.k-line { width: 20px; height: 0; display: inline-block; border-top: 2px solid var(--ink-2); }
.k-line.dash { border-top-style: dashed; border-top-width: 1.5px; }
.k-sw { width: 14px; height: 3px; display: inline-block; border-radius: 2px; }
.k-sw.s1 { background: var(--s1); }
.k-sw.s2 { background: var(--s2); }
.chart { width: 100%; position: relative; }
.chart svg { display: block; overflow: visible; max-width: 100%; }
.chart text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.c-grid { stroke: var(--grid); stroke-width: 1; }
.c-axis { stroke: var(--axis); stroke-width: 1; }
.c-tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.c-axt { fill: var(--muted); font-size: 11.5px; }
.c-val { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
.c-ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.c-reflbl { fill: var(--muted); font-size: 11.5px; }
.c-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.l1 { stroke: var(--s1); }
.l2 { stroke: var(--s2); }
.m-fill1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
.m-fill2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
.m-hol1 { fill: var(--surface); stroke: var(--s1); stroke-width: 2; }
.m-hol2 { fill: var(--surface); stroke: var(--s2); stroke-width: 2; }
.c-wash { fill: transparent; }
.c-group { cursor: pointer; }
.c-group:hover .c-wash, .c-group.on .c-wash { fill: var(--hover); }
.c-group:focus { outline: none; }
.c-group:focus-visible .c-wash { stroke: var(--focus); stroke-width: 2; }
.c-group.on .c-xt { fill: var(--ink); font-weight: 700; }
.c-xt { fill: var(--ink-2); font-size: 11.5px; }
.c-xd { fill: var(--muted); font-size: 10.5px; }
.detail { margin-top: 10px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); }
.detail .d-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 4px; }
.detail .d-id { font-weight: 700; }
.detail .d-what { font-weight: 600; margin: 0 0 6px; }
.detail .d-nums { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.detail .d-note { margin: 6px 0 0; font-size: 13px; color: var(--ink-2); }
.cap { font-size: 13px; color: var(--muted); margin: 10px 0 0; max-width: 90ch; }
details.twin { margin-top: 10px; }
details.twin summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:hover td { background: var(--hover); }
tr.dim td { color: var(--ink-2); }
@media (max-width: 760px) {
  table.resp thead { display: none; }
  table.resp, table.resp tbody, table.resp tr, table.resp td { display: block; width: 100%; }
  table.resp tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  table.resp td { border: 0; padding: 3px 0; display: grid; grid-template-columns: 96px 1fr; gap: 8px; text-align: left; }
  table.resp td::before { content: attr(data-label); font-size: 11.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; padding-top: 2px; }
  table.resp td.n { text-align: left; white-space: normal; }
}
.warn { font-size: 13.5px; background: var(--plan-bg); color: var(--plan-fg); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
.steps { margin: 0; padding-left: 20px; }
.steps li { margin: 6px 0; }
pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0 0; font-size: 12.5px; }
@media (forced-colors: active) { .badge, .fchip, .detail { border: 1px solid CanvasText; } }
</style>
</head>

          h("td", { "data-label": "possessions", class: "n", text: r.poss }))))))));
  }

  /* ---------- 5. How to add a point ---------- */
  function addPanel() {
    const a = DATA.addPoint;
    return h("section", { class: "block", id: "add", "aria-labelledby": "h-add" },
      sectionHead("add", "How to add a point"),
      h("div", { class: "card" }, h("p", { html: md(a.intro) }),
        h("ol", { class: "steps" }, a.steps.map(t => h("li", { html: md(t) }))),
        h("pre", {}, h("code", { text: a.example }))));
  }

  /* ---------- Render ---------- */
  function render() {
    $("#site-title").textContent = DATA.title;
    $("#site-sub").textContent = DATA.subtitle;
    $("#footer").innerHTML = md(DATA.footer);
    const jump = $("#jump");
    DATA.links.forEach(l => jump.append(h("a", { class: l.cls || "", href: l.href, text: l.label })));
    DATA.sections.forEach(([id, label]) => jump.append(h("a", { href: "#" + id, text: label })));
    const main = $("#main");
    main.append(headline(), chart(), ledger(), windowPanel(), addPanel());
    drawLegend();
    drawChart(true);
    drawDetail();
    if (window.ResizeObserver) new ResizeObserver(() => drawChart(false)).observe(chartBox);
    else window.addEventListener("resize", () => drawChart(false));
    updateThemeButton();
  }
  render();
})();
</script>
</body>
</html>
