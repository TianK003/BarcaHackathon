<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Possession Pipeline Overview</title>
<meta name="description" content="The team's overview of the BAR-ATH possession pipeline: what runs today, how it works, its history and the work left before the deadline.">
<script>
  // Apply a remembered theme before first paint. Storage can be blocked (file://, private mode), so guard it.
  try {
    var t = localStorage.getItem("mtah-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1;
  --surface: #ffffff;
  --surface-2: #f8f8f6;
  --ink: #0b0b0b;
  --ink-2: #47463f;
  --muted: #66655f;
  --line: #e3e2dc;
  --line-2: #cfcec6;
  --axis: #a9a8a0;
  --grid: #ebeae4;
  --accent: #1f6fcf;
  --accent-soft: rgba(42, 120, 214, 0.18);
  --focus: #1f6fcf;
  --hover: rgba(11, 11, 11, 0.045);
  --code-bg: #f0efea;
  --s1: #2a78d6;
  --s2: #eb6834;
  --lab-h: #2a78d6;
  --lab-a: #c93c3b;
  --lab-d: #8d8c85;
  --ok-bg: #e2f3e2; --ok-fg: #0b5a0b;
  --off-bg: #e9ecf0; --off-fg: #3a4758;
  --ref-bg: #eeeeea; --ref-fg: #45443f;
  --bad-bg: #f7e4e2; --bad-fg: #8a2a24;
  --plan-bg: #fbeed2; --plan-fg: #6e4700;
  --info-bg: #e2edfb; --info-fg: #17508f;
  --rule-bg: #ece9fb; --rule-fg: #45389e;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  --built-line: #2e8540; --built-tint: rgba(46, 133, 64, 0.07); --built-glow: rgba(46, 133, 64, 0.16);
  --todo-line: #d9730d; --todo-tint: rgba(217, 115, 13, 0.08); --todo-glow: rgba(217, 115, 13, 0.22);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0f0e;
    --surface: #1a1a19;
    --surface-2: #212120;
    --ink: #f0efec;
    --ink-2: #c9c8be;
    --muted: #a3a29a;
    --line: #2e2e2b;
    --line-2: #44443f;
    --axis: #5d5c56;
    --grid: #2a2a28;
    --accent: #5d9fe9;
    --accent-soft: rgba(57, 135, 229, 0.28);
    --focus: #7db3ef;
    --hover: rgba(255, 255, 255, 0.06);
    --code-bg: #262624;
    --s1: #3987e5;
    --s2: #d95926;
    --lab-h: #3987e5;
    --lab-a: #d65a59;
    --lab-d: #6d6c66;
    --ok-bg: #16301a; --ok-fg: #93dc93;
    --off-bg: #262b32; --off-fg: #b7c3d4;
    --ref-bg: #2b2b29; --ref-fg: #c9c8be;
    --bad-bg: #3b1e1c; --bad-fg: #f1a8a2;
    --plan-bg: #3a2e12; --plan-fg: #f3c96c;
    --info-bg: #162a43; --info-fg: #95c1f3;
    --rule-bg: #2a2548; --rule-fg: #c0b7f6;
    --shadow: none;
    --built-line: #5cbf6b; --built-tint: rgba(92, 191, 107, 0.09); --built-glow: rgba(92, 191, 107, 0.20);
    --todo-line: #f0a03c; --todo-tint: rgba(240, 160, 60, 0.10); --todo-glow: rgba(240, 160, 60, 0.26);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f0e;
  --surface: #1a1a19;
  --surface-2: #212120;
  --ink: #f0efec;
  --ink-2: #c9c8be;
  --muted: #a3a29a;
  --line: #2e2e2b;
  --line-2: #44443f;
  --axis: #5d5c56;
  --grid: #2a2a28;
  --accent: #5d9fe9;
  --accent-soft: rgba(57, 135, 229, 0.28);
  --focus: #7db3ef;
  --hover: rgba(255, 255, 255, 0.06);
  --code-bg: #262624;
  --s1: #3987e5;
  --s2: #d95926;
  --lab-h: #3987e5;
  --lab-a: #d65a59;
  --lab-d: #6d6c66;
  --ok-bg: #16301a; --ok-fg: #93dc93;
  --off-bg: #262b32; --off-fg: #b7c3d4;
  --ref-bg: #2b2b29; --ref-fg: #c9c8be;
  --bad-bg: #3b1e1c; --bad-fg: #f1a8a2;
  --plan-bg: #3a2e12; --plan-fg: #f3c96c;
  --info-bg: #162a43; --info-fg: #95c1f3;
  --rule-bg: #2a2548; --rule-fg: #c0b7f6;
  --shadow: none;
  --built-line: #5cbf6b; --built-tint: rgba(92, 191, 107, 0.09); --built-glow: rgba(92, 191, 107, 0.20);
  --todo-line: #f0a03c; --todo-tint: rgba(240, 160, 60, 0.10); --todo-glow: rgba(240, 160, 60, 0.26);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
}
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
code, pre, kbd {
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 0.86em;
}
code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0; }
h2 { font-size: 20px; font-weight: 650; }
h3 { font-size: 16px; font-weight: 650; }
h4 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
p { margin: 0 0 10px; }
ul, ol { margin: 0; padding-left: 20px; }
li { margin: 4px 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 720px) { .wrap { padding: 0 24px; } }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

/* Header and tabs */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; }
.brand h1 { font-size: 17px; font-weight: 700; }
.brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.theme-btn {
  flex: none; border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.theme-btn:hover { background: var(--hover); }
.navrow { display: flex; align-items: flex-end; gap: 6px; margin-top: 8px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; min-width: 0; }
.navlink {
  flex: none; padding: 9px 10px 10px; font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none;
  border-bottom: 2px solid transparent; border-left: 1px solid var(--line); margin-bottom: 2px; white-space: nowrap;
}
.navlink:hover { border-bottom-color: var(--accent); }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 0; background: none; padding: 9px 12px 10px; font-size: 14px; font-weight: 600;
  color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; border-radius: 0;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
main { padding: 20px 0 8px; }
.panel[hidden] { display: none; }
.section { margin: 0 0 28px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
.lead { font-size: 15.5px; color: var(--ink-2); max-width: 78ch; }

/* Cards, badges */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.kpi-label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.kpi-value { font-size: 30px; font-weight: 650; line-height: 1.1; letter-spacing: -0.01em; }
.kpi-value.hero { font-size: 46px; }
.kpi-unit { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kpi-second { font-size: 15px; font-weight: 600; color: var(--ink-2); margin: 4px 0 8px; }
.kpi-text { font-size: 13.5px; color: var(--ink-2); margin: 8px 0 0; }
.kpi-note { font-size: 13px; color: var(--ink-2); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.flag { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; background: var(--plan-bg); color: var(--plan-fg); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
.flag code { background: transparent; padding: 0; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; line-height: 1.5;
  padding: 0 8px; border-radius: 999px; white-space: nowrap; background: var(--b-bg); color: var(--b-fg);
  vertical-align: middle;
}
.badge .g { font-size: 11px; }
td .badge, .plist .badge { white-space: normal; }
.ok { --b-bg: var(--ok-bg); --b-fg: var(--ok-fg); }
.off { --b-bg: var(--off-bg); --b-fg: var(--off-fg); }
.ref { --b-bg: var(--ref-bg); --b-fg: var(--ref-fg); }
.bad { --b-bg: var(--bad-bg); --b-fg: var(--bad-fg); }
.plan { --b-bg: var(--plan-bg); --b-fg: var(--plan-fg); }
.info { --b-bg: var(--info-bg); --b-fg: var(--info-fg); }
.rule { --b-bg: var(--rule-bg); --b-fg: var(--rule-fg); }

/* Dates strip */
.dates { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.date { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.date .d-label { font-size: 12.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.date .d-when { font-size: 22px; font-weight: 650; margin: 2px 0; }
.date .d-date { font-size: 13px; color: var(--ink-2); }
.date.key { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.date.past .d-when { color: var(--muted); }

/* Two-column helpers */
.two { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 960px) { .two { grid-template-columns: 1.15fr 1fr; } .two.even { grid-template-columns: 1fr 1fr; } .two.wide { grid-template-columns: 2fr 1fr; } }

/* What runs today chain */
.chain { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 14px; }
.chain-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
@media (max-width: 560px) {
  .chain-row.seq { flex-direction: column; align-items: flex-start; }
  .chain-row.seq .chain-arrow { transform: rotate(90deg); margin-left: 12px; line-height: 1; }
}
.link { border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; background: var(--surface-2); font-size: 12.5px; min-width: 0; }
.link b { display: block; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; font-weight: 650; }
.link span { color: var(--muted); }
.chain-arrow { align-self: center; color: var(--axis); font-size: 18px; }
.chan { font-size: 11.5px; font-weight: 650; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-2); white-space: nowrap; }

/* Next steps */
.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps > li { position: relative; padding: 0 0 12px 34px; margin: 0; counter-increment: s; }
.steps > li::before {
  content: counter(s); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--line-2); font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; color: var(--ink-2);
}
.steps > li b { display: block; }
.steps > li p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }

/* Charts */
.chart-card { padding-bottom: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin: 6px 0 10px; }
.legend .k { display: inline-flex; align-items: center; gap: 6px; }
.key-rect { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.key-line { width: 18px; height: 2px; display: inline-block; border-radius: 2px; }
.key-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 2px solid var(--ink-2); }
.key-dot.filled { background: var(--ink-2); }
.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.c-grid { stroke: var(--grid); stroke-width: 1; }
.c-axis { stroke: var(--axis); stroke-width: 1; }
.c-tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.c-label { fill: var(--ink-2); font-size: 13px; }
.c-label-strong { fill: var(--ink); font-size: 13px; font-weight: 600; }
.c-val { fill: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.c-note { fill: var(--muted); font-size: 11.5px; }
.f1 { fill: var(--s1); }
.f2 { fill: var(--s2); }
.l1 { stroke: var(--s1); }
.l2 { stroke: var(--s2); }
.c-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.c-dot { stroke: var(--surface); stroke-width: 2; }
.c-hollow { fill: var(--surface); stroke-width: 2; }
.c-hit { fill: transparent; }
.c-group:hover .c-wash, .c-group:focus .c-wash, .c-group.on .c-wash { fill: var(--hover); }
.c-wash { fill: transparent; }
.c-group:focus { outline: none; }
.c-group:focus-visible .c-wash { stroke: var(--focus); stroke-width: 2; }
.c-cross { stroke: var(--axis); stroke-width: 1; }
.chart-cap { font-size: 13px; color: var(--muted); margin: 10px 0 0; max-width: 90ch; }
details.table-twin { margin-top: 10px; }
details.table-twin summary, details.fold summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.tip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 160px; max-width: 300px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);
}
.tip[hidden] { display: none; }
.tip .t-head { font-weight: 650; margin-bottom: 4px; }
.tip .t-sub { color: var(--muted); margin-bottom: 6px; }
.tip .t-row { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
.tip .t-row strong { font-variant-numeric: tabular-nums; font-size: 13px; }
.tip .t-row span.n { color: var(--muted); }
.tip .t-key { width: 14px; height: 2px; border-radius: 2px; flex: none; }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover td { background: var(--hover); }
th button.sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button.sort .arr { opacity: 0.35; }
th[aria-sort] button.sort .arr { opacity: 1; }
@media (max-width: 680px) {
  table.resp thead { display: none; }
  table.resp, table.resp tbody, table.resp tr, table.resp td { display: block; width: 100%; }
  table.resp tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  table.resp td { border: 0; padding: 3px 0; display: grid; grid-template-columns: 96px 1fr; gap: 8px; text-align: left; }
  table.resp td::before { content: attr(data-label); font-size: 11.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; padding-top: 2px; }
  table.resp td.n { text-align: left; }
}

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 12px; }
.filters label { font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
select, input[type="search"] {
  font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 8px; padding: 5px 8px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.fchip[aria-pressed="true"] { background: var(--b-bg, var(--hover)); color: var(--b-fg, var(--ink)); border-color: transparent; font-weight: 600; }
.fchip[aria-pressed="false"] { color: var(--muted); }
.count { font-size: 13px; color: var(--muted); }

/* Pipeline diagram */
.diagram-legend { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink-2); margin-bottom: 14px; }
.flow { display: grid; grid-template-columns: 1fr; row-gap: 24px; }
.fi { position: relative; min-width: 0; }
.fi.arrow::after { content: ""; position: absolute; left: calc(50% - 1px); bottom: -15px; width: 2px; height: 11px; background: var(--axis); }
.fi.arrow::before { content: ""; position: absolute; left: calc(50% - 6px); bottom: -22px; border-top: 7px solid var(--axis); border-left: 6px solid transparent; border-right: 6px solid transparent; }
.node, .static {
  display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch;
  width: 100%; height: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 10px; padding: 10px 12px; color: inherit; font: inherit; box-shadow: var(--shadow);
}
.node .n-open { margin-top: auto; padding-top: 6px; }
.node { cursor: pointer; }
.node:hover { border-color: var(--accent); }
.node[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.static { background: var(--surface-2); }
.n-num { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; display: block; }
.n-name { font-size: 15px; font-weight: 700; display: block; }
.n-desc { font-size: 12.5px; color: var(--ink-2); display: block; margin-top: 3px; line-height: 1.4; }
.n-open { font-size: 12px; color: var(--accent); display: block; margin-top: 6px; font-weight: 600; }
.n-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.n-chips .badge { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; padding: 0 6px; }
.assets { list-style: none; padding: 0; margin: 6px 0 0; font-size: 12.5px; }
.assets li { margin: 3px 0; display: flex; gap: 6px; align-items: baseline; color: var(--ink-2); }
.assets li .g { width: 12px; flex: none; text-align: center; font-size: 11px; }
.junction { display: flex; align-items: center; justify-content: center; height: 100%; }
.junction span {
  display: block; text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface-2);
  border: 1px dashed var(--line-2); border-radius: 999px; padding: 6px 10px; line-height: 1.35;
}
.side .node { background: var(--surface-2); border-style: dashed; }
.side-tag { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 2px; }
.conn { display: none; }
/* Built (green) and not built yet (orange): a stage's box, the chips inside it, the legend */
.node.st-built { border-width: 2px; border-style: solid; border-color: var(--built-line); background-image: linear-gradient(var(--built-tint), var(--built-tint)); box-shadow: 0 0 0 3px var(--built-glow); }
.node.st-todo { border-width: 2px; border-style: dashed; border-color: var(--todo-line); background-image: linear-gradient(var(--todo-tint), var(--todo-tint)); box-shadow: 0 0 0 3px var(--todo-glow); }
.node.st-built:hover, .node.st-todo:hover { box-shadow: 0 0 0 3px var(--accent-soft); }

}

@media (min-width: 1080px) {
  .flow { grid-template-columns: 1fr 0.95fr 1.5fr 0.7fr 0.95fr 0.95fr 0.8fr 0.95fr 0.9fr; column-gap: 22px; row-gap: 0; align-items: stretch; }
  .fi.arrow::after { left: auto; right: -14px; top: calc(50% - 1px); bottom: auto; width: 11px; height: 2px; }
  .fi.arrow::before { left: auto; right: -21px; top: calc(50% - 6px); bottom: auto; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 7px solid var(--axis); border-right: 0; }
  .conn { display: block; grid-row: 2; position: relative; height: 30px; }
  .conn::before { content: ""; position: absolute; left: calc(50% - 1px); top: 7px; bottom: 0; width: 2px; background: var(--axis); }
  .conn::after { content: ""; position: absolute; left: calc(50% - 6px); top: 0; border-bottom: 7px solid var(--axis); border-left: 6px solid transparent; border-right: 6px solid transparent; }
  .conn.c3 { grid-column: 3; } .conn.c5 { grid-column: 5; } .conn.c6 { grid-column: 6; }
  .fi.cfg { grid-row: 3; grid-column: 3 / 7; }

  .fi.bench::before { content: ""; position: absolute; left: -21px; top: calc(50% - 6px); border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 7px solid var(--axis); }
  .row1 { grid-row: 1; }
}

/* Stage detail panel */

}

}

/* How it works */
.prose { max-width: 80ch; }

  content: counter(p); position: absolute; left: 12px; top: 10px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent); color: var(--surface); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}

.mchips { display: flex; flex-wrap: wrap; gap: 6px; }

.model { scroll-margin-top: 120px; margin-bottom: 22px; }
.m-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.m-head h2 { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 20px; }
.m-q { font-size: 17px; font-weight: 600; margin: 8px 0 4px; max-width: 80ch; }

.m-grid { display: grid; gap: 18px 28px; grid-template-columns: 1fr; margin-top: 14px; }

.m-sec { min-width: 0; }

.formula { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 10px; }
.kpis { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 4px 0 12px; }

.illus-svg { display: block; width: 100%; max-width: 560px; height: auto; }

.i-pitch { fill: none; stroke: var(--line-2); stroke-width: 0.5; }

.cell.N { background: transparent; border: 1px dashed var(--line-2); color: var(--muted); }
.cell.hw { background: transparent; border: 2px solid var(--lab-h); color: var(--lab-h); }
.cell.aw { background: transparent; border: 2px solid var(--lab-a); color: var(--lab-a); }
.strips { margin: 4px 0 0; }

  .strips .strip-row { grid-template-columns: 76px 1fr; gap: 6px; }

}
.skey { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin: 6px 0 0; }

/* a boosted model's first questions, as a flow */

.bbox { border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 9px; background: var(--surface); font-size: 12.5px; min-width: 0; flex: 1 1 120px; max-width: 200px; display: flex; flex-direction: column; gap: 2px; }

/* a decision tree, as an indented list (readable at any width) */
.dtree, .dtree ul { list-style: none; margin: 0; padding: 0; }

.dtree[data-sense="alive"] .dleaf.pos { --leaf: var(--accent); }

.m-charts { display: grid; gap: 22px 28px; grid-template-columns: 1fr; }
@media (min-width: 980px) { .m-charts { grid-template-columns: 1fr 1fr; } }
.m-chart { min-width: 0; }
.m-ct { font-weight: 650; font-size: 14px; color: var(--ink); margin: 0 0 2px; }
.mini-models { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin: 0 0 18px; }
.mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); min-width: 0; }
.mini .mini-top { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }

.mini .mini-k { font-size: 12.5px; color: var(--ink-2); margin: 0 0 6px; }

.more-link { font-size: 13px; font-weight: 600; }
.c-ref { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
.c-diag { stroke: var(--axis); stroke-width: 1; stroke-dasharray: 4 4; }

        "**Why trees here.** They take raw metres, seconds and shares without scaling; they send a missing value down a learned side of each split (our ball is missing on 41% of frames, and a team can be missing too); and they capture interactions (many slow players together with a still ball). The one direct study of in-play status from tracking found boosting best (Lang et al. 2022)."

        question: "Given every source's opinion on every frame, what is the most likely sequence of possessions and stoppages for the whole half?",

        intuition: [
          "Sources disagree and flicker, and spellF1 punishes every flicker: a blip turns one possession into three (T04). The decoder treats the labels as a path through three states and picks the path with the best total score over the whole half at once.",
          "Each source turns its probability into **nats** (log-likelihood ratios) for the states it speaks about, and a NaN adds nothing. A path's score is the sum of its frames' nats, minus **6** for every change of team and **32** for every change into or out of `D`.",
          "So a change has to be paid for by evidence. Three frames of a touch episode pay for a change of team, but a blip (out and back) costs 12 nats and needs strong evidence. And no possession may be shorter than **35 frames** (1.4 s), no stoppage shorter than **25** (1 s).",
          "Viterbi finds the best path exactly by dynamic programming, in time linear in the half's length: nothing is approximated, and the same input always gives the same labels."

        visual: "hmm",
        strips: {
          rows: [["evidence leans", "HHHAHHHH··DDDDD·AAAA"], ["decoded (hmm)", "HHHHHHHHHHDDDDDDAAAA"]],

        reads: "One emission score per frame and state, summed over the sources in the config, each at its weight w (an exponent on its likelihood):",
        formula: "where home h is known:   e[H] += w·log 2h     e[A] += w·log 2(1 − h)\nwhere alive a is known:  e[H], e[A] += w·log 2a     e[D] += w·log 2(1 − a)\npath score = Σ e[t, state] − 6 · (changes of team) − 32 · (changes into or out of D)",
        params: "`switch_team` 6 · `switch_dead` 32 · `min_possession` 35 · `min_dead` 25 · per graded half",

        limits: [
          "Its four numbers were chosen on DFL's fine-grained truth; the coarse truth prefers longer minimums (T33). R024 chose them again on the mean of the two (R023) and kept them: the mean alone leans coarse, and the declared tie-break held them. R030, on `generic`, moved `switch_team` to 6 the same way: the best mean sat at 8 and 50, and the tie-break refused the 0.015 it costs under the raw truth.",

  traps: [
    { id: "T01", title: "No tuning on the public window: a rule, not just a bad idea.", line: "Since 23 Oct (`f8f2629`) the public 5 minutes only check the pipeline; choosing, calibrating or training on them breaks the rules. One possession there moves spellF1 about 0.06." },
    { id: "T02", title: "`X` means “repeat my last label”, and at a half's start “copy my first label”.", line: "The 2,934 graded frames before the 2nd-half kick-off are all `D`: an `X` there becomes a long spurious possession." },
    { id: "T03", title: "Latency is expensive.", line: "Perfect labels 1 s late score spellF1 0.65, 8 frames late 0.89. Back-date a change to where its evidence starts." },
    { id: "T04", title: "A blip costs three possessions.", line: "Five frames of `A` inside an `H` possession split it and add a spurious `A`; but real short possessions exist (0.76 s, 1.32 s), so minimums need validating, not guessing." },
    { id: "T05", title: "`H H D D H H` is two possessions.", line: "Missing a stoppage merges the possessions around it; inventing one splits a possession." },
    { id: "T06", title: "Possession counts differ between tools.", line: "`validate_submission.py` treats `X` as a gap over the whole file; the scorer bridges `X` inside the graded halves. Compare like with like." },
    { id: "T08", title: "Off by one.", line: "ATD `frame_id` runs 1…199,319; submission rows, homography and video start at 0. Smart Tagging: `round(s × 25)`." },
    { id: "T09", title: "~164k rows means you indexed the broadcast.", line: "The broadcast has its own timeline and no mapping to the tactical one." },
    { id: "T11", title: "Temporal code must run per half.", line: "11,185–90,651 and 110,808–190,197 (`games.half_video_blocks`); the runner enforces it for every decoder and refiner." },
    { id: "T12", title: "A missing ball is not a dead ball, in either direction.", line: "The ball is visible on 66% of dead-ball frames in the public window, and in-play gaps of 10 s or more are normal." },
    { id: "T13", title: "Ball gaps are long, not flickers.", line: "150 gaps over the graded halves, median 10.7 s, p90 34 s, max 3.7 min; gaps under 2 s hold 0.1% of the missing frames, so interpolation buys almost nothing." },
    { id: "T14", title: "The nearest player is not the possessor.", line: "Wrong on 22% of in-play, ball-visible public frames: passes in flight, duels, deflections." },
    { id: "T15", title: "Track slots are tracklets, not players.", line: "46 slots for 22 players that appear, vanish, swap and duplicate; build permutation-invariant features." },
    { id: "T21", title: "Line endings change the file.", line: "Write with `newline=\"\\n\"`, and compare hashes of freshly regenerated files, not of the working tree." },
    { id: "T24", title: "The scorer reads every CSV in `evaluation/results/`.", line: "Use `--results <dir>`; never name our files `baseline_*.csv`; `starter/baseline.py` without `--out` overwrites the committed baselines." },
    { id: "T25", title: "Data must never leave our machines the wrong way.", line: "No match data to any LLM; nothing from `data/` or derived frame-level data in git; check `git status` before every commit." },
    { id: "T26", title: "Nothing about this fixture from outside the bundle.", line: "Event feeds, possession stats, match reports, goal times: human-produced data about this game, from any source, is off-limits." },
    { id: "T27", title: "No hand labels on this match, not even to validate, and the public window is not training data.", line: "Watching is only to understand what counts as possession, never to check our output against the video (since Nov 2026, [docs/rules.md](../docs/rules.md)); turning what was seen into labels, corrections, or rules and constants tied to frames is not allowed." },
    { id: "T28", title: "Speed is not presence.", line: "The ATD speed channel is NaN on 370,297 slot-frames and 103,579 ball frames where the position exists: test presence on x." },
    { id: "T31", title: "The ATD ball-speed channel is unusable.", line: "NaN on 92.2% of graded ball-present frames, and where given it behaves like a player's speed (median 1.3 m/s against 4.8): derive speed from positions." },
    { id: "T33", title: "DFL's possessions are fine-grained, and the public window cannot say by how much ours differ.", line: "437 possessions a match, median 3.7 s. Rank length-dependent choices under the raw and the coarse truth and treat a disagreement as a warning." },

  /* ---------- How it works ---------- */
  how: {
    task: [
      "For every frame of the tactical video of FC Barcelona (home) against Athletic Club (away), LaLiga 2024-25 MD2 (199,319 frames at 25 fps), output `H` (home has the ball, in play), `A` (away has it), `D` (dead ball) or `X` (abstain). Only the graded halves count: frames 11,185–90,651 and 110,808–190,197.",
      "The ranking metric is **spellF1**. A possession is a maximal run of `H` or of `A` inside a graded half, so `H H D D H H` is two. Predicted possessions are matched one-to-one to true ones (same team, greedy by temporal IoU), and F1 is averaged over IoU 0.3, 0.4, 0.5, 0.6 and 0.7. Ties are broken by **macroF1**.",
      "**Flicker is fatal.** The raw nearest-player baseline reports 131 possessions in the public window against 17 real ones, and a five-frame blip turns one possession into three (T04). **Latency costs too:** perfect labels 1 s late score 0.65 (T03).",
      "**`X` is forward-filled for spellF1** with the last label in the half (back-filled at its start): free inside a possession, but across a hand-over it drags the old team over the new one. For macroF1 an `X` on a graded frame is a miss. So abstain inside possessions if at all, and guess at transitions."
    ],
    illustrations: [
      { title: "A blip costs three possessions", rows: [["truth", "HHHHHHHHHHHHDDDAAAAA"], ["predicted", "HHHHHAAHHHHHDDDAAAAA"]],
        cap: "Two frames of `A` split one true `H` possession into `H`, `A`, `H`: one possession becomes three, and none of the pieces may reach the IoU thresholds." },
      { title: "X is forward-filled for spellF1", rows: [["predicted", "HHHHHHXXXXXXXXAAAAAA"], ["as scored", "HHHHHHHHHHHHHHAAAAAA"], ["truth", "HHHHHHHHAAAAAAAAAAAA"]],
        cap: "The `X` run takes the last label before it, so an abstention across a hand-over pushes the change late. Inside a possession it costs nothing on spellF1." }
    ],
    illustrationNote: "Illustrations with made-up frames, not data.",
    facts: [
      { value: "40.7%", label: "of graded frames have no ball", text: "In only 150 gaps, median 10.7 s (p90 34 s, max 3.7 min). Gaps under 2 s hold 0.1% of the missing frames, so interpolation cannot help: possession changes inside the gaps." },
      { value: "12%", label: "missing in the public window", text: "Later 5-minute blocks reach 80%. The window is the best-covered block of the whole match, so it flatters ball-based methods." },
      { value: "22%", label: "nearest player on the wrong team", text: "With the ball visible and in play, the nearest player's team is wrong on 22% of frames: passes in flight, duels, deflections." },
      { value: "66%", label: "of dead-ball frames show the ball", text: "Placed, held, thrown in: a missing ball is not a dead ball, and the baseline hands those frames to a team." },
      { value: "7.6 s", label: "median possession", text: "6 of the 17 public possessions last under 5 s, and the six shortest tolerate only 0.3–1.5 s of total boundary error at IoU 0.7. The baselines report 398–1,949 possessions: fragmentation is their main failure." }
    ],
    factsNote: "Measured on 2026-10-21 (A01–A03); “What the measurements say” in [proposals.md](../docs/proposals.md). These five facts drove the ordering of the proposals.",
    principles: [
      "**Opinions are separate from decisions.** Evidence sources say what the data suggests about each frame and never pick a label; the decoder weighs every source and pays for every change. A new source plugs in without touching the decoder.",
      "**Decoders never see across halftime.** The runner cuts the evidence into one block per graded half before any decoder or refiner runs, and writes `X` outside the blocks (T11).",
      "**Every constant is chosen on other matches, by a rule declared before the run** (or is a measurement on other matches, a fixed rule or the documented kick-offs). Each constant of `main.toml` traces to its entry in docs/results.md (the audit in the technical document, section 5). The one constant once measured on our match, `smart_tagging`'s c_team, went out with its source in R029, because the organisers' clarification of 3 Nov forbids it ([docs/rules.md](../docs/rules.md)).",
      "**The public window only checks correctness.** It holds 17 possessions, ranks the baselines the wrong way round and, since 23 Oct (`f8f2629`), is “not training data and not a tuning set” (T01).",
      "**Nothing trained, fitted or tuned on this match**, with labels or without, since the organisers' clarification of November 2026 ([docs/rules.md](../docs/rules.md)); **no hand labels on it** and no hand-corrected tracking (`c073f29`, `f8f2629`, T27). The labels come from an algorithm.",
      "**Byte for byte.** Same config, data and versions give the same bytes: seeded, pinned dependencies, LF endings, one command from `data/` to the CSV."
    ],
    solution: [
      { name: "controlled_touch", p: "P04", role: "home where the ball is seen",
        why: "The nearest player is wrong 22% of the time, and possession changes only when the other team gains controlled possession. A control episode is a player within 1.5 m of the ball, no opponent within the duel radius, moving with it; its vote (0.93) starts on the episode's first frame (back-dating, T03), and a weak hold (0.60, R030) keeps the last controlling team through a pass in flight.",
        added: "Together with P05 and the re-tuned decoder: **+0.2199 raw** over `nearest_w50` (R010, 7 wins in 7). Removing it from R010's config loses 0.1421 raw." },
      { name: "dead_ball_model", p: "P05", role: "alive",
        why: "The ball is visible on 66% of dead frames and missing in long in-play gaps, so its presence cannot say `D`. Boosted trees on 30 play features, trained on the seven DFL matches degraded like ours, beat logistic regression and fixed rules (R009).",
        added: "Part of R010's **+0.2199 raw**; alive/dead F1 0.9726, on a benchmark that overstates it for our match (T38, T39)." },
      { name: "hmm", p: "P06", role: "the decoder",
        why: "Possessions are intervals and spellF1 pays for every split. Per half, the decoder pays 6 nats for a change of team and 32 for a change into or out of `D`, and allows no possession under 35 frames and no stoppage under 25.",
        added: "Alone with the old sources it did not clear its bar (R007: +0.0036 raw). It is what P04, P05 and P07 plug into; its parameters were re-chosen in R010, R013 and R030." },
      { name: "shape_possession", p: "P07", role: "home everywhere, the only home in the gaps",
        why: "40.7% of graded frames have no ball, in gaps long enough to hold several possessions. 26 features of how the two teams stand and move, none reading the ball, trained on DFL with the ball hidden; weight 0.3 on every graded frame (R030).",
        added: "**+0.0942 raw** over R010 (R011, 7 wins in 7; +0.1035 coarse). Not a forecast for our match: the model never saw our teams." },
      { name: "shift_edges", p: "P02", role: "refine",
        why: "With 0.3–1.5 s of slack on short possessions, a systematic offset is fatal. The edges move by the pipeline's own lag on DFL, negated: team +1, into `D` −2, out of `D` 0 frames.",
        added: "**+0.0005 raw**, inside noise (R012): adopted because its declared rule said so, not because it is shown to help." },
      { name: "R013 retune", p: "P04 · P06 · P07", role: "the constants again",
        why: "In R006 to R009 every candidate carried a value derived from the public window (`nearest_player` at 0.78 or `ball_presence`, A01), so the touch rule was chosen with them present. After the 23 Oct rule, R013 re-chose the touch rule (192 configs), then `switch_team`, `min_possession` and P07's weight (144 configs) on `main.toml`'s own evidence, with no window-derived value in any candidate.",
        added: "**+0.0267 raw** (p 0.0156, 7 wins in 7) and +0.0001 coarse: a raw-truth gain (T33)." },
      { name: "R024 re-choice", p: "P23 A", role: "the constants on the mean",
        why: "R023 found our provider's grain between the two truths, so choices now rank on the mean of the raw and coarse pooled spellF1s. R024 re-ranked R013's two grids on it: only the touch hold moved (0.60 to 0.55); the decoder, P07's weight and the shift came back unchanged.",
        added: "**+0.0052 on the mean** (p 0.0469, 6 wins in 7): −0.0067 raw, +0.0171 coarse." },
      { name: "R030 re-choice", p: "P27", role: "everything again, on a profile that measures nothing of our match",
        why: "The organisers' reply of 5 Nov allows nothing that no text allows explicitly, and the benchmark's degradation was fitted on our own tracking. R030 replaced it with `generic` v1 (two figures from the organisers' DATA.md, the rest declared before any run), retrained both models and chose every numeric constant again: the hold 0.55 to 0.60, `switch_team` 4 to 6, the shape weight 0.2 to 0.3, the rest unchanged. The gains listed above were measured on the retired profile.",
        added: "**0.5414 raw / 0.5829 coarse** (mean 0.5622) against 0.5388 / 0.5779 for the constants it replaced on the same profile: mean +0.0038 (p 0.0312, 6 wins in 7). The bar: +0.3529 raw over `nearest_w50` and +0.3738 coarse over `nearest_w125`, 7 wins in 7 each." }
    ],
    validate: [
      "**P01's benchmark.** The seven DFL/IDSSE open matches (two Bundesliga, five 2. Bundesliga; CC BY 4.0). Their truth is built as ours is: `D` where `BallStatus` is dead, else the team in `BallPossession`. Configs run through the pipeline's own components and are scored by the official scorer, half by half.",
      "**Degraded by a declared profile.** `generic` v1, the default since R030: the ball is missing on 41% of the frames and each player is lost on 6.8% of them, the two rates the organisers publish in DATA.md; everything else is a round rule declared before any run (gap lengths log-uniform between 1 s and 60 s, onsets blind to the play, tracked spans log-uniform between 2 s and 300 s, a 7-frame moving average). No measurement of ours enters it, and it has no fidelity gate against our match. Until 9 Nov the default was `tracking` v3, fitted on label-free statistics of our tracking (all eight gates passed, R004c); by our reading the organisers' reply of 5 Nov does not permit that, so it and `context` are retired, kept in the code for the record of R002 to R029.",
      "**Two truths.** Raw is DFL's flag (437 possessions a match, median 3.7 s); coarse absorbs every possession under 5 s that sits between two of the other team. Our grain is not known (R023's measurement of it used data since withdrawn), so a choice ranks on their mean, kept on 9 Nov as the neutral objective, and both are read (T33).",
      "**Uncertainty.** 90% t-intervals over the seven per-match deltas, the exact sign-flip test (the smallest possible p is 2/128 = 0.0156) and wins of seven; never a bootstrap. A degradation seed moves a pooled spellF1 by up to about 0.015.",
      "**The bar and the rule.** Each experiment declares its values, objective, selection rule and bar in docs/results.md before its runs. The rule (`choose.py`): since R023, the best mean of the raw and coarse pooled spellF1s, ties within 0.005, then the larger min(raw, coarse) (`--objective mean`, R024); before it, the best raw, then the best coarse; with a leave-one-match-out estimate. P06's bar: a delta above 0 with p ≤ 0.05 against `nearest_w50` raw and `nearest_w125` coarse.",
      "**The caveats.** T38: `generic`'s gaps are blind to the play, so the benchmark cannot value evidence about where the ball is lost. T39: DFL tracks the ball out of play, so P05 looks near-perfect there; its benchmark score is an upper bound. `generic` has no wrong-team slots or NaN-speed runs, and its gap law is one declared range: another would give other constants. Absolute benchmark spellF1 is not our leaderboard's."
    ],
    limits: [
      "**The benchmark's conventions.** DFL's flags may flip at other moments than our truth's, and P04's back-dating, P05's `D` onset and the shift follow DFL. A11's leads (our `D` 2.5–3 s longer, our team flipping about a second earlier) are not measurements.",
      "**Seven matches,** five of them one club's home games: the intervals are wide, and selecting from hundreds of configs is optimistic (R030 chose from R013's two grids, 192 and 144 configs, and held out one match at a time its rules' picks are no better than the constants they replaced: −0.0048 and −0.0009 on the mean).",
      "**The shape model never saw our teams.** P07's benchmark gain is not a forecast for BAR-ATH, and the possession count moved the other way on our match (down 2.4%, where the benchmark's went up 16%).",
      "**The grain of our truth is unknown, and two choices sit on it.** The raw and the coarse truth pull the hold and the decoder in opposite directions (T33). R030's rule decided both on a knife-edge: the hold 0.60 is inside the 0.005 tie band by 0.000004 (on the mean alone 0.55 is 0.0050 better), and the decoder is the tie-break's choice over a best-mean config that is +0.0069 on the mean but −0.0146 under the raw truth. If our truth is coarse, both cost a little.",
      "**DFL tracks the ball out of play.** Two profiles that hide it were tried and dropped (R015, R015b), so how much of P05 transfers stays unmeasured (T39).",
      "**No video, audio, homography or Smart Tagging on the benchmark,** so P08, P09, P10, P14 and P15 cannot be validated there.",
      "**The benchmark's profile is declared, not measured.** `generic` quotes two figures from the organisers' DATA.md, and no text allows quoting them by name: a residual risk, stated in the technical document. It has no wrong-team slots or NaN-speed runs, and no fidelity gate says how far it is from our tracking, by design."
    ]
  },

      text: "A clone of the pushed repository, a new venv from the requirements files and the raw bundle with no caches: `main.csv` came out `7ba575c0…` on two runs and at the default threads, both models retrained identical, and the benchmark returned 0.5430 / 0.5593. One machine only." },

    { date: "2026-10-31", title: "R024: R013 re-chosen on the mean of the two truths", entries: "P23 A, R024", outcome: "adopted", stages: ["evidence", "decode", "benchmark"],
      text: "R013's two grids re-ranked under R023's objective (`choose.py --objective mean`, 192 reports, then 144 configs run at the new hold): only the touch hold moved, 0.60 to 0.55; the decoder, P07's weight and the shift came back unchanged. 0.5363 raw / 0.5764 coarse: +0.0052 on the mean (p 0.0469, 6 wins in 7), −0.0067 raw, +0.0171 coarse. On our match 399 possessions (413), `D` 36.0%, 1.66% of graded frames relabelled. `main.toml`, sha256 `e6496a9b…`; the public window, a correctness check: macroF1 0.7007, spellF1 0.4000." },
    { date: "2026-10-31", title: "A19: where the decoder loses, and how calibrated it is", entries: "P23 B and D, A19", outcome: "analysis", stages: ["decode", "benchmark"],
      text: "The fall from IoU 0.3 to 0.7 is mostly edges on otherwise right possessions (0.0704 of spellF1 on the mean of the two truths; merges 0.0254, splits 0.0273), and a wrong edge is most often late. The sources are near calibrated (`dead_ball_model` α 1.00, P07 1.07 to 1.10); the decoder's posterior is four to five times too sharp (α 0.19 team, 0.27 alive). New tool: `diagnose.py`." },

    { date: "2026-10-31", title: "P23 E: P07 weighted apart in the gaps, dropped", entries: "R026", outcome: "dropped", stages: ["evidence"],

    { date: "2026-10-31", title: "P22(b): P07 recalibrated from the touch rule's own labels, dropped at its gate", entries: "R027", outcome: "dropped", stages: ["evidence", "benchmark"],
      text: "An intercept on P07's logit for each half, fitted on the other half's controlled-touch frames with the rule's 7% label noise allowed for, tested on DFL before any source was merged: P07's pooled log-loss in the held-out half's gaps went from 0.3759 to 0.3820 (0.002 lower was needed), worse on 5 of 7 matches; the retry's column, a team-aware head, 0.4597. The offsets exist (0.276 on average), but the touches' is not the gaps' (transfer 0.296 against noise 0.107). No spellF1; code removed in `9ee4d1f`." },
    { date: "2026-11-02", title: "P15 use 1: the broadcast's ball in our gaps, dropped at its fidelity gate", entries: "R028", outcome: "dropped", stages: ["inputs", "benchmark"],
      text: "The broadcast aligned by code (d₁ 4,014, d₂ 26,919 frames; live 91.6%) and its usable ball filling our missing ball on graded frames, behind a config switch. DFL has no broadcast, so a simulated one transplanted BAR-ATH's real fill gap by gap. Its fidelity gates failed on `tracking`: fill on alive gap frames 0.218 against our 0.295, on D frames 0.089 against 0.041; DFL's served gaps are 54% alive against our 20% (T38). The advisor found no departure of the code from part 1 (an identity world gives our placement statistics back exactly, F5 within 0.02 m), so the failure was the verdict: no bar run, no spellF1, code removed (T53). The fill is untested, not refuted." },
    { date: "2026-11-03", title: "R029: Smart Tagging taken out of main.toml under the rules of 3 Nov", entries: "P08, R029", outcome: "adopted", stages: ["evidence"],
      text: "The organisers' clarification of 3 Nov has parameters tuned on external data only ([docs/rules.md](../docs/rules.md)); `smart_tagging`'s c_team 0.76 was measured on our match (R017), and its weight was picked after seeing our match's output. Nothing else changed. The benchmark stays R024's by construction, 0.5363 raw / 0.5764 coarse: it always ran `main.toml` without the tags. On our match, label-free against R024's file: 2.94% of graded frames changed (42.3% of them where the ball is not seen), `D` 36.00% to 35.92%, possessions 399 to 413. `main.csv` `762f9073…`, the same on two runs, not uploaded; self-tests 191 of 191 and 460 passed. The public window, a check that chose nothing (T01): macroF1 0.7149, spellF1 0.4444, 19 possessions against 17." },
    { date: "2026-11-09", title: "The organisers' reply to our questions recorded (A24)", entries: "A24, P27", outcome: "analysis", stages: ["project", "benchmark"],
      text: "On 5 Nov the organisers answered questions 1 to 4 with their clarification and “anything that is not explicitly allowed is not permitted” ([docs/rules.md](../docs/rules.md)). By our reading the benchmark's degradation, fitted on our tracking, is not permitted, and Metrica's sample data (no licence) is withdrawn; watching the video stays limited to understanding what counts as possession; the repository may stay private until shortly before the form. Upstream unchanged (`f8f2629`); its issues and pull requests are switched off. `main.toml` unchanged; Tian decided the same evening: redo (P27), keep the mean of the two truths, do not send questions 5 and 6." },
    { date: "2026-11-10", title: "R030: both models retrained and every constant re-chosen on a degradation that measures nothing of our match", entries: "P27, R030", outcome: "adopted", stages: ["benchmark", "evidence", "decode", "refine"],
      text: "Declared on 9 Nov before any run, and run overnight with an advisor agent in Tian's place. The profile `generic` v1 quotes two figures from the organisers' DATA.md (the ball missing on 41% of the graded frames, a mean of 20.5 tracked objects) and declares the rest; no measurement of ours enters it. Both models were retrained (dead-ball held-out log-loss 0.0788, the logistic reference 0.1524; shape 0.3560 on ball-missing frames). Chosen again by the declared rules: the touch rule unchanged with the hold 0.55 to 0.60, `switch_team` 4 to 6, the shape weight 0.2 to 0.3; `switch_dead`, `min_dead`, the dead-ball weight, the shape scope and the shift unchanged. 0.5414 raw / 0.5829 coarse (mean 0.5622) against the incumbent constants' 0.5388 / 0.5779; the bar passes, +0.3529 raw over `nearest_w50` and +0.3738 coarse over `nearest_w125`, 7 wins in 7 each. Two choices were knife-edges under the declared tie-break and are listed for Tian. The old profiles stay in the code, retired. Not uploaded." },
    { date: "2026-11-10", title: "R031: back-dating a possession to the first touch, dropped at its gate (P28)", entries: "P28, R031", outcome: "dropped", stages: ["evidence"],
      text: "The next step after R030, ruled by an advisor in Tian's place: date a possession from the team's first touch instead of from its first controlled episode. The gate, declared before any config, asked that the frames the rule would back-date be the touching team's at least 70% of the time; they are 33.8% (τ = 3 m/s) and 46.5% (τ = 6). Nothing was built into the pipeline." },
    { date: "2026-11-10", title: "After R030's choice: six seeds, the alternative from the hold 0.55, each source ablated, and the headroom on `generic` (A25)", entries: "R030, A25", outcome: "analysis", stages: ["benchmark"],
      text: "Declared before they ran, and choosing nothing. At six seeds the declared constants, the protocol re-run from the hold 0.55 (0.5374 raw / 0.5903 coarse), Stage C's best mean and the constants before R030 lie within 0.0054 on the mean; the tie that brought the hold 0.60 in does not repeat on fresh seeds. Without the touch rule the mean falls by 0.0304, without the shape model by 0.1037. A25: a perfect dead-ball detector would add +0.028 raw, a perfect team where the ball is seen +0.199 and in the gaps +0.180: the remaining score is who has the ball. The two knife-edge choices are Tian's to review; `main.toml` holds the declared outcome." }

  function drawProgression(box, W) {

  let lastTab = null;
  function route() {
    let raw = (location.hash || "").replace(/^#/, "");
    try { raw = decodeURIComponent(raw); } catch (e) { /* keep it as it is */ }
    const [tab, sub] = raw.split("/");
    const t = TABS.indexOf(tab) >= 0 ? tab : "overview";
    TABS.forEach(id => {
      const on = id === t;
      const btn = $("#tab-" + id);
      btn.setAttribute("aria-selected", on ? "true" : "false");
      btn.setAttribute("tabindex", on ? "0" : "-1");
      $("#panel-" + id).hidden = !on;
    });
    hideTip();
    if (t === "pipeline") selectStage(sub && stageById(sub) ? sub : (selectedStage || "evidence"), false);
    // A link to a model scrolls to its card; a link to another tab (the Start here path) starts at its top.
    const target = t === "models" && sub ? document.getElementById("model-" + sub) : null;
    if (target) requestAnimationFrame(() => target.scrollIntoView({ block: "start" }));
    else if (lastTab !== null && t !== lastTab && t !== "pipeline") window.scrollTo(0, 0);
    lastTab = t;
  }
  $$(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-tab");
      if (location.hash.replace(/^#/, "").split("/")[0] === id) { route(); return; }
      location.hash = id;
      window.scrollTo(0, 0);
    });
    btn.addEventListener("keydown", e => {
      const i = TABS.indexOf(btn.getAttribute("data-tab"));
      let j = -1;
      if (e.key === "ArrowRight") j = (i + 1) % TABS.length;
      else if (e.key === "ArrowLeft") j = (i - 1 + TABS.length) % TABS.length;
      else if (e.key === "Home") j = 0;
      else if (e.key === "End") j = TABS.length - 1;
      if (j >= 0) { e.preventDefault(); const nb = $("#tab-" + TABS[j]); nb.focus(); nb.click(); }
    });
  });
  window.addEventListener("hashchange", route);
  window.addEventListener("scroll", hideTip, { passive: true });

  renderChrome();
  renderOverview();
  renderPipeline();
  renderModels();
  renderHow();
  renderHistory();
  renderWork();
  renderReference();
  route();
})();
</script>
</body>
</html>
