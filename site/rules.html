:root {
  color-scheme: light;
  --bg: #f4f4f1;
  --surface: #ffffff;
  --surface-2: #f8f8f6;
  --ink: #0b0b0b;
  --ink-2: #47463f;
  --muted: #66655f;
  --line: #e3e2dc;
  --line-2: #cfcec6;
  --axis: #a9a8a0;
  --grid: #ebeae4;
  --accent: #1f6fcf;
  --accent-soft: rgba(42, 120, 214, 0.18);
  --focus: #1f6fcf;
  --hover: rgba(11, 11, 11, 0.045);
  --code-bg: #f0efea;
  --s1: #2a78d6;
  --s2: #eb6834;
  --lab-h: #2a78d6;
  --lab-a: #c93c3b;
  --lab-d: #8d8c85;
  --ok-bg: #e2f3e2; --ok-fg: #0b5a0b;
  --off-bg: #e9ecf0; --off-fg: #3a4758;
  --ref-bg: #eeeeea; --ref-fg: #45443f;
  --bad-bg: #f7e4e2; --bad-fg: #8a2a24;
  --plan-bg: #fbeed2; --plan-fg: #6e4700;
  --info-bg: #e2edfb; --info-fg: #17508f;
  --rule-bg: #ece9fb; --rule-fg: #45389e;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0f0e;
    --surface: #1a1a19;
    --surface-2: #212120;
    --ink: #f0efec;
    --ink-2: #c9c8be;
    --muted: #a3a29a;
    --line: #2e2e2b;
    --line-2: #44443f;
    --axis: #5d5c56;
    --grid: #2a2a28;
    --accent: #5d9fe9;
    --accent-soft: rgba(57, 135, 229, 0.28);
    --focus: #7db3ef;
    --hover: rgba(255, 255, 255, 0.06);
    --code-bg: #262624;
    --s1: #3987e5;
    --s2: #d95926;
    --lab-h: #3987e5;

    --off-bg: #262b32; --off-fg: #b7c3d4;

  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0f0e;
  --surface: #1a1a19;
  --surface-2: #212120;
  --ink: #f0efec;
  --ink-2: #c9c8be;
  --muted: #a3a29a;
  --line: #2e2e2b;
  --line-2: #44443f;
  --axis: #5d5c56;
  --grid: #2a2a28;
  --accent: #5d9fe9;
  --accent-soft: rgba(57, 135, 229, 0.28);
  --focus: #7db3ef;
  --hover: rgba(255, 255, 255, 0.06);
  --code-bg: #262624;
  --s1: #3987e5;
  --s2: #d95926;
  --lab-h: #3987e5;
  --lab-a: #d65a59;
  --lab-d: #6d6c66;
  --ok-bg: #16301a; --ok-fg: #93dc93;
  --off-bg: #262b32; --off-fg: #b7c3d4;
  --ref-bg: #2b2b29; --ref-fg: #c9c8be;
  --bad-bg: #3b1e1c; --bad-fg: #f1a8a2;
  --plan-bg: #3a2e12; --plan-fg: #f3c96c;
  --info-bg: #162a43; --info-fg: #95c1f3;
  --rule-bg: #2a2548; --rule-fg: #c0b7f6;
  --shadow: none;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
}
a { color: var(--accent); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 0.86em; }
code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0; }
h2 { font-size: 21px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 650; }
p { margin: 0 0 10px; }
ul, ol { margin: 0; padding-left: 20px; }
li { margin: 4px 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
@media (min-width: 720px) { .wrap { padding: 0 24px; } }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; }
.brand h1 { font-size: 17px; font-weight: 700; }
.brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.theme-btn {
  flex: none; border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.theme-btn:hover { background: var(--hover); }
.jump { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.jump::-webkit-scrollbar { display: none; }
.jump a {
  flex: none; padding: 9px 10px 10px; font-size: 14px; font-weight: 600; color: var(--muted); text-decoration: none;
  border-bottom: 2px solid transparent;
}
.jump a:hover { color: var(--ink); }
.jump a.home { color: var(--accent); }
main { padding: 20px 0 8px; }
section.block { margin: 0 0 32px; scroll-margin-top: 110px; }
.block-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 14px; margin-bottom: 12px; }
.block-head p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 72ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }

.banner { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; background: var(--info-bg); color: var(--info-fg); border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; font-size: 13.5px; }
.banner code { background: rgba(127, 127, 127, 0.14); }
.banner .cmd { flex: 1 1 320px; margin: 0; }

.summary { font-size: 16.5px; line-height: 1.6; max-width: 86ch; }
.summary strong { font-weight: 700; }

/* The exact line on learning from the provided match */
.line-grid { display: grid; gap: 14px; grid-template-columns: 1fr; margin-top: 12px; }
@media (min-width: 900px) { .line-grid { grid-template-columns: 1.55fr 1fr; } }
.forbid {
  background: var(--bad-bg); color: var(--ink); border: 2px solid var(--bad-fg); border-radius: 12px; padding: 16px 18px;
}
.forbid h3, .permit h3 { display: flex; align-items: center; gap: 10px; font-size: 19px; margin-bottom: 10px; }
.forbid h3 { color: var(--bad-fg); }
.permit h3 { color: var(--ok-fg); }
.big-glyph { display: inline-flex; width: 30px; height: 30px; border-radius: 50%; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; flex: none; }
.forbid .big-glyph { background: var(--bad-fg); color: var(--bad-bg); }
.permit .big-glyph { background: var(--ok-fg); color: var(--ok-bg); }
.forbid ul, .permit ul { list-style: none; padding: 0; margin: 0; }
.forbid li, .permit li { padding: 8px 0 8px 26px; position: relative; margin: 0; border-top: 1px solid rgba(127, 127, 127, 0.22); font-size: 15px; }
.forbid li:first-child, .permit li:first-child { border-top: 0; }
.forbid li::before { content: "✕"; position: absolute; left: 2px; top: 8px; color: var(--bad-fg); font-weight: 800; }
.permit li::before { content: "✓"; position: absolute; left: 2px; top: 8px; color: var(--ok-fg); font-weight: 800; }
.forbid li strong { color: var(--bad-fg); }
.src { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.permit { background: var(--ok-bg); border: 1px solid var(--ok-fg); border-radius: 12px; padding: 16px 18px; }
.permit .note { font-size: 13.5px; margin: 10px 0 0; color: var(--ink-2); }
.misreading { margin-top: 12px; font-size: 14px; color: var(--ink-2); max-width: 90ch; }

/* Rule cards */
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
.rule-card { border-left-width: 4px; display: flex; flex-direction: column; gap: 8px; }
.rule-card.no { border-left-color: var(--bad-fg); }
.rule-card.yes { border-left-color: var(--ok-fg); }
.rule-card.team { border-left-color: var(--rule-fg); }
.rc-top { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.rc-title { font-size: 15.5px; font-weight: 700; }
.rule-card p { margin: 0; font-size: 14px; color: var(--ink-2); }
blockquote { margin: 0; padding: 6px 10px; border-left: 3px solid var(--line-2); background: var(--surface-2); border-radius: 0 6px 6px 0; font-size: 13.5px; color: var(--ink-2); }
blockquote cite { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 3px; }
.means h4 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 2px; }
.means ul { padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
.srcs a { font-size: 12px; border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 7px; text-decoration: none; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
.srcs a:hover { background: var(--hover); }
.badge {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; line-height: 1.5;
  padding: 0 8px; border-radius: 999px; background: var(--b-bg); color: var(--b-fg); white-space: nowrap;
}
.ok { --b-bg: var(--ok-bg); --b-fg: var(--ok-fg); }
.bad { --b-bg: var(--bad-bg); --b-fg: var(--bad-fg); }
.rule { --b-bg: var(--rule-bg); --b-fg: var(--rule-fg); }
.info { --b-bg: var(--info-bg); --b-fg: var(--info-fg); }
.ref { --b-bg: var(--ref-bg); --b-fg: var(--ref-fg); }
.ask { margin-top: 12px; font-size: 14px; background: var(--surface); border: 1px dashed var(--line-2); border-radius: 10px; padding: 10px 14px; }

/* Deliverables */
.two { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .two { grid-template-columns: 1fr 1fr; } }
.dl { list-style: none; padding: 0; margin: 0; counter-reset: d; }
.dl > li { position: relative; padding: 0 0 12px 34px; margin: 0; counter-increment: d; font-size: 14px; color: var(--ink-2); }
.dl > li::before { content: counter(d); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
.dl > li strong { color: var(--ink); display: block; }
.facts { list-style: none; padding: 0; margin: 0; }
.facts li { padding: 7px 0; border-bottom: 1px solid var(--line); margin: 0; font-size: 14px; color: var(--ink-2); }
.facts li:last-child { border-bottom: 0; }
.dates { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 14px; }
.date { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.date.key { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.date .d-label { font-size: 12.5px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.date .d-when { font-size: 21px; font-weight: 650; margin: 2px 0; }
.date.past .d-when { color: var(--muted); }
.date .d-date { font-size: 13px; color: var(--ink-2); }
.cmd { position: relative; margin: 8px 0; }
.cmd pre { margin: 0; padding: 8px 64px 8px 10px; background: var(--code-bg); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; line-height: 1.45; border: 1px solid var(--line); color: var(--ink); }
.copy { position: absolute; top: 5px; right: 5px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; font-size: 11.5px; padding: 1px 8px; cursor: pointer; color: var(--ink); }
.copy:hover { background: var(--hover); }

/* Self-check */
.checks { list-style: none; padding: 0; margin: 0; }
.checks li { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin: 0 0 8px; background: var(--surface); }
.checks li.stop { border-color: var(--bad-fg); background: var(--bad-bg); }
.checks li.clear { border-color: var(--ok-fg); }
.q { font-size: 14.5px; }
.q .badge { margin-left: 6px; }
.yn { display: inline-flex; gap: 6px; }
.yn button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 3px 14px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.yn button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.advice { grid-column: 1 / -1; font-size: 13.5px; color: var(--bad-fg); font-weight: 600; }
.advice[hidden] { display: none; }
.check-sum { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; font-size: 14px; }
.reset { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
@media (max-width: 560px) { .checks li { grid-template-columns: 1fr; } }

/* History */
.hist { list-style: none; padding: 0; margin: 0; position: relative; }
.hist::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.hist li { position: relative; padding: 0 0 14px 28px; margin: 0; }
.hist li::before { content: ""; position: absolute; left: 2px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--axis); }
.hist li.key::before { border-color: var(--rule-fg); background: var(--rule-bg); }
.h-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.h-date { font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.h-title { font-weight: 650; }
.hist p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); max-width: 90ch; }

footer { border-top: 1px solid var(--line); margin-top: 24px; padding: 16px 0 28px; font-size: 13px; color: var(--muted); }
@media (forced-colors: active) { .badge, .forbid, .permit { border: 1px solid CanvasText; } }
</style>
</head>

  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <h1 id="site-title"></h1>
        <p id="site-sub"></p>
      </div>
      <button type="button" class="theme-btn" id="theme-btn" aria-label="Switch theme"><span aria-hidden="true" id="theme-icon"></span><span id="theme-text"></span></button>

  </div>
</header>

<main class="wrap" id="main"></main>

    const dates = h("div", { class: "dates" }, DATA.dates.map(d => {
      const n = daysUntil(d.date);
      return h("div", { class: "date" + (d.key ? " key" : "") + (n < 0 ? " past" : "") },
        h("div", { class: "d-label", text: d.label }), h("div", { class: "d-when", text: dayWords(n) }), h("div", { class: "d-date", text: fmtDate(d.date) }));
    }));
    return h("section", { class: "block", id: "deliverables", "aria-labelledby": "h-del" },
      h("div", { class: "block-head" }, h("h2", { id: "h-del", text: "Deliverables and dates" }), h("p", { text: "Day counts come from your computer's date." })),
      dates,
      h("div", { class: "two" },
        h("article", { class: "card" }, h("h3", { text: "The three deliverables", style: "margin-bottom:10px" }),
          h("ol", { class: "dl" }, DATA.deliverables.map(d => h("li", {}, h("strong", { html: md(d.title) }), h("span", { html: md(d.text) })))),
          h("p", { class: "small", html: md(DATA.validate.text) }), cmdBlock(DATA.validate.cmd)),
        h("article", { class: "card" }, h("h3", { text: "The form", style: "margin-bottom:6px" }),
          h("ul", { class: "facts" }, DATA.form.map(f => h("li", { html: md(f) }))),
          h("p", { class: "small", style: "margin-top:10px", html: md(DATA.team) }),
          srcLinks(DATA.deliverableSources))));
  }

  function renderTeam() {
    const T = DATA.teamPractice;
    return h("section", { class: "block", id: "team", "aria-labelledby": "h-team" },
      h("div", { class: "block-head" }, h("h2", { id: "h-team", text: "Our team's practices" }), h("p", { html: md(T.intro) })),
      h("div", { class: "cards" }, T.items.map(t => h("article", { class: "card rule-card team" },
        h("div", { class: "rc-top" }, badge("rule", "§", "team practice, not a competition rule")),
        h("h3", { class: "rc-title", html: md(t.title) }), h("p", { html: md(t.text) })))),
      h("div", { style: "margin-top:10px" }, srcLinks(T.source)));
  }

  function renderSelfCheck() {
    const answers = DATA.selfCheck.map(() => null);
    const sum = h("span", { "aria-live": "polite" });
    const list = h("ol", { class: "checks" });
    const rows = DATA.selfCheck.map((c, i) => {
      const advice = h("div", { class: "advice", hidden: true, text: c.stop });
      const btn = v => {
        const b = h("button", { type: "button", "aria-pressed": "false", text: v === "yes" ? "Yes" : "No" });
        b.addEventListener("click", () => { answers[i] = answers[i] === v ? null : v; paint(); });
        return b;
      };
      const yes = btn("yes"), no = btn("no");
      const kindBadge = c.kind === "rule" ? badge("bad", "§", "rule") : badge("rule", "§", "rule + team practice");
      const li = h("li", {}, h("div", { class: "q" }, h("span", { html: md(c.q) }), kindBadge),
        h("div", { class: "yn", role: "group", "aria-label": "Answer" }, yes, no), advice);
      list.append(li);
      return { li, yes, no, advice };
    });
    function paint() {
      let answered = 0, stops = 0;
      rows.forEach((r, i) => {
        const a = answers[i], c = DATA.selfCheck[i];
        r.yes.setAttribute("aria-pressed", a === "yes" ? "true" : "false");
        r.no.setAttribute("aria-pressed", a === "no" ? "true" : "false");
        const stop = a && a !== c.safe;
        r.li.classList.toggle("stop", !!stop);
        r.li.classList.toggle("clear", !!a && !stop);
        r.advice.hidden = !stop;
        if (a) answered++;
        if (stop) stops++;
      });
      sum.textContent = answered + " of " + rows.length + " answered" + (stops ? " · " + stops + " need a look before you go on" : answered === rows.length ? " · all clear" : "");
    }
    const reset = h("button", { type: "button", class: "reset", text: "Reset" });
    reset.addEventListener("click", () => { answers.fill(null); paint(); });
    paint();
    return h("section", { class: "block", id: "self-check", "aria-labelledby": "h-check" },
      h("div", { class: "block-head" }, h("h2", { id: "h-check", text: "A quick self-check before you run or commit" }), h("p", { text: "Answer each one honestly. Nothing is stored or sent anywhere." })),
      h("div", { class: "check-sum" }, sum, reset), list);
  }

  function renderHistory() {
    return h("section", { class: "block", id: "history", "aria-labelledby": "h-hist" },
      h("div", { class: "block-head" }, h("h2", { id: "h-hist", text: "Rule history" }), h("p", { text: "The organisers' commits upstream, oldest first." })),
      h("div", { class: "card" }, h("ol", { class: "hist" }, DATA.history.map(e => h("li", { class: e.key ? "key" : null },
        h("div", { class: "h-top" }, h("span", { class: "h-date", text: e.date }), h("span", { class: "h-title", text: e.title }), e.commit ? h("code", { text: e.commit }) : null),
        h("p", { html: md(e.text) }))))));
  }

  themeBtn();
  render();
})();
</script>
